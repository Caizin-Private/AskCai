<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InSync</title>
  <!-- Teams JS SDK v2 -->
  <script src="https://unpkg.com/@microsoft/teams-js@2.22.0/dist/MicrosoftTeams.min.js"></script>
  <!-- Theme pre-init before SDK resolves (eliminates flash) -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get("theme");
      document.documentElement.setAttribute("data-theme",
        p === "dark" ? "dark" : p === "contrast" ? "contrast" : "default");
    })();
  </script>
  <style>
    /* ── Fluent UI–aligned tokens for 3 Teams themes ─────────────────────── */
    :root, [data-theme="default"] {
      --bg:        #ffffff;
      --bg-card:   #f5f5f5;
      --bg-hover:  #ebebeb;
      --text:      #242424;
      --text2:     #424242;
      --text3:     #616161;
      --brand:     #0078d4;
      --brand-bg:  #eff6fc;
      --border:    #d1d1d1;
      --border-s:  #e0e0e0;
      --c-good:    #107c10;   /* AdaptiveCard "Good"    */
      --c-accent:  #0078d4;   /* AdaptiveCard "Accent"  */
      --c-warn:    #8a6914;   /* AdaptiveCard "Warning" */
      --shadow:    0 2px 8px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] {
      --bg:        #292929;
      --bg-card:   #3d3d3d;
      --bg-hover:  #454545;
      --text:      #ffffff;
      --text2:     #d6d6d6;
      --text3:     #adadad;
      --brand:     #479ef5;
      --brand-bg:  #0a2f5c;
      --border:    #525252;
      --border-s:  #3d3d3d;
      --c-good:    #54b05a;
      --c-accent:  #479ef5;
      --c-warn:    #d6a014;
      --shadow:    0 2px 8px rgba(0,0,0,0.3);
    }
    [data-theme="contrast"] {
      --bg:        #000000;
      --bg-card:   #0d0d0d;
      --bg-hover:  #1f1f1f;
      --text:      #ffffff;
      --text2:     #ffffff;
      --text3:     #ffffff;
      --brand:     #1aebff;
      --brand-bg:  #000000;
      --border:    #ffffff;
      --border-s:  #ffffff;
      --c-good:    #00ff00;
      --c-accent:  #1aebff;
      --c-warn:    #ffff00;
      --shadow:    none;
    }

    /* ── Reset ────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
    }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Scrollable area ──────────────────────────────────────────────────── */
    .content { flex: 1; overflow-y: auto; padding: 20px 16px 88px; }

    /* ── Gate (non-pilot) ─────────────────────────────────────────────────── */
    #gate-view {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; text-align: center; gap: 8px;
    }
    #gate-view h1 { font-size: 1.1rem; }
    #gate-view p  { color: var(--text3); font-size: 0.875rem; }

    /* ── Main view ────────────────────────────────────────────────────────── */
    #main-view { display: none; }

    /* ── Greeting ─────────────────────────────────────────────────────────── */
    .greeting     { margin-bottom: 20px; }
    .greeting h1  { font-size: 1.25rem; font-weight: 600; }
    .greeting .dt { font-size: 0.8rem; color: var(--text3); margin-top: 2px; }

    /* ── Attendance card container ────────────────────────────────────────── */
    .att-card {
      background: var(--bg-card);
      border: 1px solid var(--border-s);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    /* Title variants matching AdaptiveCard color semantics */
    .ct          { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
    .ct.good     { color: var(--c-good); }
    .ct.accent   { color: var(--c-accent); }
    .ct.warn     { color: var(--c-warn); }
    .ct.neutral  { color: var(--text); }
    .ct.subtle   { color: var(--text3); }

    .cs { font-size: 0.875rem; color: var(--text2); line-height: 1.55; }

    /* ── Loading skeleton ─────────────────────────────────────────────────── */
    .skel { display: flex; flex-direction: column; gap: 10px; }
    .sl {
      background: var(--bg-hover);
      border-radius: 4px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .sl.h20 { height: 20px; }
    .sl.h14 { height: 14px; width: 75%; }
    .sl.h12 { height: 12px; width: 50%; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity: 0.4; } }

    /* ── Location buttons (pending / edit) ────────────────────────────────── */
    .loc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .loc-btn {
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s, border-color 0.12s;
    }
    .loc-btn:hover { background: var(--bg-hover); border-color: var(--brand); }

    /* ── Ghost / pill button ──────────────────────────────────────────────── */
    .ghost-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--brand);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ghost-btn:hover { background: var(--brand-bg); }

    /* ── Quickstart bar ───────────────────────────────────────────────────── */
    .qs-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 64px;
      background: var(--bg);
      border-top: 1px solid var(--border-s);
      display: none;
      align-items: center;
      justify-content: space-around;
      padding: 10px 12px 12px;
      gap: 8px;
      z-index: 100;
    }
    .qs-btn {
      flex: 1;
      height: 36px;
      border: 1.5px solid var(--brand);
      border-radius: 20px;
      background: transparent;
      color: var(--brand);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }
    .qs-btn:hover { background: var(--brand); color: var(--bg); }

    /* ── Slide-up panel (Leave Balance) ───────────────────────────────────── */
    .panel-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200; align-items: flex-end;
    }
    .panel-overlay.open { display: flex; }
    .panel {
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border-s);
      width: 100%; max-height: 70vh; overflow-y: auto;
      padding: 12px 20px 32px;
    }
    .ph { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
    .panel h2   { font-size: 1rem; font-weight: 600; margin-bottom: 10px; }
    .panel-body { font-size: 0.875rem; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }

    /* ── Dialogs ──────────────────────────────────────────────────────────── */
    dialog {
      border: none; border-radius: 12px; padding: 0;
      width: min(480px, 94vw);
      background: var(--bg); color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }
    dialog::backdrop  { background: rgba(0,0,0,0.45); }
    .di               { padding: 24px; }
    .di h2            { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    .field            { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .field label      { font-size: 0.78rem; font-weight: 600; color: var(--text3); }
    .field select,
    .field input[type="date"],
    .field textarea   {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: inherit;
      background: var(--bg-card);
      color: var(--text);
    }
    .field textarea   { resize: vertical; min-height: 64px; }
    .da               { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .da button        { padding: 8px 20px; border: none; border-radius: 6px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    .btn-p            { background: var(--brand); color: var(--bg); }
    .btn-s            { background: var(--bg-hover); color: var(--text); }
    #leave-status     { font-size: 0.8rem; color: var(--text3); min-height: 18px; margin-top: 8px; }

    /* ── Dashboard dialog ─────────────────────────────────────────────────── */
    #dash-dialog { width: min(620px, 96vw); margin: auto; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .dash-header h2 { margin: 0; }
    .dash-close  { padding: 6px 14px; font-size: 0.82rem; font-weight: 600; }
    .dt-filters  { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .dt-search   { flex: 1; min-width: 140px; padding: 7px 10px; border: 1px solid var(--border-s); border-radius: 8px; font-size: 0.85rem; background: var(--bg-card); color: var(--text); outline: none; }
    .dt-search:focus { border-color: var(--brand); }
    .dt-filter   { padding: 7px 12px; border: 1px solid var(--border-s); border-radius: 8px; font-size: 0.82rem; background: var(--bg-card); color: var(--text); cursor: pointer; outline: none; }
    .dt-filter:focus { border-color: var(--brand); }
    .dt-count    { font-size: 0.78rem; color: var(--text3); margin-bottom: 8px; }
    .dt-wrap     { overflow-x: auto; }
    .dt-tbl      { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .dt-tbl th   { text-align: left; padding: 8px 10px; background: var(--bg-card); border-bottom: 2px solid var(--border-s); font-weight: 600; color: var(--text3); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.4px; }
    .dt-tbl td   { padding: 9px 10px; border-bottom: 1px solid var(--border-s); vertical-align: middle; }
    .dt-tbl tr:last-child td { border-bottom: none; }
    .chip        { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; border: 1px solid currentColor; }
  </style>
</head>
<body>
  <div class="content">
    <!-- Non-pilot gate -->
    <div id="gate-view">
      <h1>Access restricted</h1>
      <p>This app is currently in pilot. Contact HR to request access.</p>
    </div>

    <!-- Pilot main view -->
    <div id="main-view">
      <div class="greeting">
        <h1 id="greet-h1">Good day!</h1>
        <div class="dt" id="greet-dt"></div>
      </div>
      <div class="att-card">
        <!-- Loading skeleton shown immediately -->
        <div id="att-body">
          <div class="skel">
            <div class="sl h20"></div>
            <div class="sl h14"></div>
            <div class="sl h12"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fixed quickstart bar -->
  <div class="qs-bar" id="qs-bar">
    <button class="qs-btn" onclick="openBalance()">Leave Balance</button>
    <button class="qs-btn" onclick="openLeave()">Apply Leave</button>
    <button class="qs-btn" onclick="openDash()">Dashboard</button>
  </div>

  <!-- Leave Balance slide-up panel -->
  <div class="panel-overlay" id="bal-panel" onclick="closePanelIfBg(event)">
    <div class="panel">
      <div class="ph"></div>
      <h2>Leave Balance</h2>
      <div class="panel-body" id="bal-body">Fetching your leave balance…</div>
    </div>
  </div>

  <!-- Apply Leave dialog -->
  <dialog id="leave-dialog">
    <div class="di">
      <h2>Apply for Leave</h2>
      <div class="field">
        <label for="l-type">Leave Type</label>
        <select id="l-type">
          <option>Casual Leave</option>
          <option>Sick Leave</option>
          <option>Earned Leave</option>
          <option>Compensatory Off</option>
          <option>Maternity Leave</option>
          <option>Paternity Leave</option>
          <option>Loss of Pay</option>
        </select>
      </div>
      <div class="field">
        <label for="l-from">From Date</label>
        <input type="date" id="l-from" />
      </div>
      <div class="field">
        <label for="l-to">To Date</label>
        <input type="date" id="l-to" />
      </div>
      <div class="field">
        <label for="l-reason">Reason (optional)</label>
        <textarea id="l-reason" placeholder="e.g. Personal work"></textarea>
      </div>
      <div id="leave-status"></div>
      <div class="da">
        <button class="btn-s" onclick="document.getElementById('leave-dialog').close()">Cancel</button>
        <button class="btn-p" onclick="submitLeave()">Apply</button>
      </div>
    </div>
  </dialog>

  <!-- Dashboard dialog -->
  <dialog id="dash-dialog">
    <div class="di">
      <div class="dash-header">
        <h2 id="dash-title">Today's Attendance</h2>
        <button class="dash-close btn-s" onclick="document.getElementById('dash-dialog').close()">Close</button>
      </div>
      <div class="dt-filters">
        <input id="dash-search" class="dt-search" type="text" placeholder="Search by name…" oninput="renderDashTable()">
        <select id="dash-filter" class="dt-filter" onchange="renderDashTable()">
          <option value="">Filter by status</option>
          <option value="Office">Office</option>
          <option value="WFH">WFH</option>
          <option value="Client Location">Client Location</option>
          <option value="Leave">Leave</option>
          <option value="Floater Holiday">Floater Holiday</option>
          <option value="Absent">Absent</option>
          <option value="Pending">Pending</option>
        </select>
      </div>
      <div id="dash-count" class="dt-count"></div>
      <div id="dash-body"></div>
    </div>
  </dialog>

  <script>
    "use strict";

    /* ──────────────────────────────────────────────────────────────────────────
     * SOT: Caizin_Attendance_Tracker/shared/teams_client.py
     *   AUTO_COPY  → build_ack_card() auto_copy dict (exact strings)
     *   BUCKET_CLR → _RESPONSE_COLOR + _AUTO_COLOR_KEY (mapped to CSS class)
     * ──────────────────────────────────────────────────────────────────────── */

    // Exact strings from build_ack_card() auto_copy / card_messages.json
    var AUTO_COPY = {
      auto_present:       { title: "Office",                     sub: "Hi {n}, your work location has been recorded as Office based on your gate scan." },
      auto_wfh:           { title: "Work From Home",             sub: "Hi {n}, based on your Work From Home entry in Keka, your work location for today has been recorded." },
      auto_client_site:   { title: "Client Location",            sub: "Hi {n}, based on your entry in Keka, your work location for today has been recorded as Client Location." },
      auto_leave:         { title: "Leave",                      sub: "Hi {n}, based on your leave entry in Keka, your status for today has been recorded." },
      auto_floater_leave: { title: "Floater Holiday",            sub: "Hi {n}, based on your floater holiday entry in Keka, your status for today has been recorded." },
      auto_absent:        { title: "Work Location Not Recorded", sub: "Hi {n}, a work location has not been recorded for today. If you believe this is incorrect, please contact the HR team." },
    };

    // Maps bucket → AdaptiveCard color class (Good=green, Accent=blue, Warning=amber)
    var BUCKET_CLR = {
      "Office":          "good",
      "WFH":             "accent",
      "Client Location": "good",
      "Leave":           "warn",
      "Floater Holiday": "warn",
      "Absent":          "neutral",
      "Pending":         "subtle",
    };
    var AUTO_CLR = {
      auto_present:       "good",
      auto_wfh:           "accent",
      auto_client_site:   "good",
      auto_leave:         "warn",
      auto_floater_leave: "warn",
      auto_absent:        "neutral",
    };
    var CHIP_STYLE = {
      "Office":          "color:var(--c-good)",
      "WFH":             "color:var(--c-accent)",
      "Client Location": "color:var(--c-good)",
      "Leave":           "color:var(--c-warn)",
      "Floater Holiday": "color:var(--c-warn)",
      "Absent":          "color:var(--text3)",
      "Pending":         "color:var(--text3)",
    };

    // Feature flag: pilot allowlist
    var PILOT = new Set([
      "maitreyee.joshi@caizin.com",
      "yash.nikam@caizin.com",
      "rohan.lande@caizin.com",
      "nikhil.negi@caizin.com",
    ]);

    var BASE   = window.location.origin;
    var uEmail = "";
    var uName  = "";
    var att    = null;  // last fetched attendance data

    /* ── Utils ───────────────────────────────────────────────────────────── */
    function esc(v) {
      return String(v || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function repl(str, name) { return str.replace(/{n}/g, name || "there"); }

    function todayFmt() {
      // Matches tracker's strftime("%B %d, %Y") format
      return new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    }
    function fmtTime(iso) {
      if (!iso) return null;
      try {
        var d = new Date(iso);
        return d.toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: true });
      } catch (e) { return null; }
    }

    /* ── Theme ───────────────────────────────────────────────────────────── */
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme",
        t === "dark" ? "dark" : t === "contrast" ? "contrast" : "default");
    }

    /* ── Greeting ────────────────────────────────────────────────────────── */
    function setGreeting(name) {
      var h   = new Date().getHours();
      var sal = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
      var fn  = (name || "there").split(" ")[0];
      document.getElementById("greet-h1").textContent = sal + ", " + fn + "!";
      document.getElementById("greet-dt").textContent = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
    }

    /* ── Attendance render ───────────────────────────────────────────────── */
    function skeleton() {
      return '<div class="skel"><div class="sl h20"></div><div class="sl h14"></div><div class="sl h12"></div></div>';
    }

    function renderAtt(data) {
      var body  = document.getElementById("att-body");
      var first = ((data && data.name) || uName || "there").split(" ")[0];
      var today = todayFmt();

      if (!data || data.state === "loading") { body.innerHTML = skeleton(); return; }

      if (data.state === "error") {
        body.innerHTML =
          '<p class="ct neutral">Unable to load</p>' +
          '<p class="cs">Something went wrong. Please refresh and try again.</p>' +
          '<button class="ghost-btn" onclick="loadAtt()">Retry</button>';
        return;
      }

      if (data.state === "no_record") {
        body.innerHTML =
          '<p class="ct subtle">Attendance not recorded yet</p>' +
          '<p class="cs">Your attendance card will be sent at 11:00 AM. Check back later.</p>';
        return;
      }

      if (data.state === "pending") {
        // card_messages.json: card.heading + card.subtitle_default
        body.innerHTML =
          '<p class="ct neutral">' + esc("Hi " + first + ", where are you working from today?") + '</p>' +
          '<p class="cs">' + esc("Please select your work location for today.") + '</p>' +
          '<div class="loc-grid">' +
            ["Office","Home","Leave","Client Location"].map(function(lbl) {
              return '<button class="loc-btn" onclick="submitLoc(\'' + lbl + '\')">' + esc(lbl) + '</button>';
            }).join("") +
          '</div>';
        return;
      }

      if (data.state === "responded") {
        var clr    = BUCKET_CLR[data.bucket] || "neutral";
        var hdg    = today + " : " + (data.bucket || "");
        var editBt = data.can_edit
          ? '<button class="ghost-btn" onclick="showEdit()">Edit Status</button>'
          : "";
        // card_messages.json: ack.thank_you
        body.innerHTML =
          '<p class="ct ' + clr + '">' + esc(hdg) + '</p>' +
          '<p class="cs">Thank you, ' + esc(first) + '. Your response has been recorded.</p>' +
          editBt;
        return;
      }

      if (data.state === "auto") {
        var cp  = AUTO_COPY[data.sub] || { title: "Recorded", sub: "Your attendance has been recorded for today." };
        var clr = AUTO_CLR[data.sub]  || "neutral";
        var hdg = today + " : " + cp.title;
        body.innerHTML =
          '<p class="ct ' + clr + '">' + esc(hdg) + '</p>' +
          '<p class="cs">' + esc(repl(cp.sub, first)) + '</p>';
        return;
      }

      body.innerHTML = skeleton();
    }

    /* ── Edit Status flow (responded state) ──────────────────────────────── */
    function showEdit() {
      var body    = document.getElementById("att-body");
      var first   = ((att && att.name) || uName || "there").split(" ")[0];
      var curLbl  = (att && att.bucket) || "";
      // card_messages.json options.heading
      var heading = "Your current work location is set to " + curLbl + ". Would you like to update it?";
      body.innerHTML =
        '<p class="ct neutral">' + esc(heading) + '</p>' +
        '<div class="loc-grid">' +
          ["Office","Home","Leave","Client Location"].map(function(lbl) {
            return '<button class="loc-btn" onclick="submitLoc(\'' + lbl + '\')">' + esc(lbl) + '</button>';
          }).join("") +
        '</div>' +
        '<button class="ghost-btn" onclick="renderAtt(att)">Cancel</button>';
    }

    /* ── Submit location ─────────────────────────────────────────────────── */
    async function submitLoc(label) {
      document.getElementById("att-body").innerHTML = '<p class="cs">Recording your response…</p>';
      try {
        var res = await fetch(BASE + "/tabs/record-attendance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: uEmail, name: uName, status: label }),
        });
        if (!res.ok) throw new Error();
        await loadAtt();
      } catch (_) {
        document.getElementById("att-body").innerHTML =
          '<p class="cs">Could not record response. Please try again.</p>' +
          '<button class="ghost-btn" onclick="loadAtt()">Retry</button>';
      }
    }

    /* ── Attendance fetch ────────────────────────────────────────────────── */
    async function loadAtt() {
      renderAtt({ state: "loading" });
      try {
        var res = await fetch(BASE + "/tabs/attendance-status?email=" + encodeURIComponent(uEmail));
        if (!res.ok) throw new Error();
        att = await res.json();
      } catch (_) {
        att = { state: "error" };
      }
      renderAtt(att);
    }

    /* ── Leave Balance ───────────────────────────────────────────────────── */
    async function openBalance() {
      var panel = document.getElementById("bal-panel");
      var body  = document.getElementById("bal-body");
      body.textContent = "Fetching your leave balance…";
      panel.classList.add("open");
      try {
        var res  = await fetch(BASE + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: "What is my leave balance?", policy_only: true }),
        });
        var data = await res.json();
        body.textContent = data.answer || "No data returned.";
      } catch (_) {
        body.textContent = "Unable to fetch leave balance. Please try again.";
      }
    }
    function closePanelIfBg(e) {
      if (e.target === document.getElementById("bal-panel")) {
        document.getElementById("bal-panel").classList.remove("open");
      }
    }

    /* ── Apply Leave ─────────────────────────────────────────────────────── */
    function openLeave() {
      document.getElementById("leave-status").textContent = "";
      document.getElementById("leave-dialog").showModal();
    }
    async function submitLeave() {
      var lt  = document.getElementById("l-type").value;
      var fd  = document.getElementById("l-from").value;
      var td  = document.getElementById("l-to").value;
      var rsn = document.getElementById("l-reason").value.trim();
      var st  = document.getElementById("leave-status");
      if (!fd || !td) { st.textContent = "Please fill in both From and To dates."; return; }
      if (td < fd)    { st.textContent = "To Date cannot be before From Date."; return; }
      st.textContent = "Submitting…";
      try {
        var res  = await fetch(BASE + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: "Apply " + lt + " from " + fd + " to " + td + ". Reason: " + (rsn || "Not specified") + ".",
          }),
        });
        var data = await res.json();
        st.textContent = data.answer || "Leave request submitted.";
      } catch (_) {
        st.textContent = "Could not submit. Please try again.";
      }
    }

    /* ── Dashboard (real tracker data) ──────────────────────────────────── */
    var _dashRows = [];

    function renderDashTable() {
      var body    = document.getElementById("dash-body");
      var count   = document.getElementById("dash-count");
      var search  = (document.getElementById("dash-search").value || "").toLowerCase();
      var filter  = document.getElementById("dash-filter").value;
      var visible = _dashRows.filter(function(r) {
        var matchName   = !search || r.name.toLowerCase().indexOf(search) !== -1;
        var matchStatus = !filter || r.bucket === filter;
        return matchName && matchStatus;
      });
      count.textContent = visible.length + " of " + _dashRows.length + " employees";
      if (!visible.length) {
        body.innerHTML = '<p class="cs">No matching records.</p>';
        return;
      }
      body.innerHTML =
        '<div class="dt-wrap"><table class="dt-tbl">' +
        '<thead><tr><th>Employee</th><th>Status</th></tr></thead>' +
        '<tbody>' +
        visible.map(function(r) {
          var style = CHIP_STYLE[r.bucket] || "color:var(--text3)";
          return '<tr>' +
            '<td>' + esc(r.name) + '</td>' +
            '<td><span class="chip" style="' + style + '">' + esc(r.bucket) + '</span></td>' +
            '</tr>';
        }).join("") +
        '</tbody></table></div>';
    }

    async function openDash() {
      var dlg   = document.getElementById("dash-dialog");
      var body  = document.getElementById("dash-body");
      var title = document.getElementById("dash-title");
      title.textContent = "Today's Attendance";
      body.innerHTML = '<p class="cs">Loading…</p>';
      document.getElementById("dash-search").value = "";
      document.getElementById("dash-filter").value = "";
      document.getElementById("dash-count").textContent = "";
      dlg.showModal();
      dlg.onclick = function(e) { if (e.target === dlg) dlg.close(); };
      try {
        var res  = await fetch(BASE + "/tabs/tracker-dashboard");
        var data = await res.json();
        _dashRows = data.entries || [];
        if (data.date) {
          var d = new Date(data.date);
          var label = d.toLocaleDateString("en-IN", {day:"2-digit", month:"short", year:"numeric"});
          title.textContent = "Attendance — " + label;
        }
        if (!_dashRows.length) {
          body.innerHTML = '<p class="cs">No attendance records found.</p>';
          return;
        }
        renderDashTable();
      } catch (_) {
        body.innerHTML = '<p class="cs">Unable to load report. Please try again.</p>';
      }
    }

    /* ── Init ────────────────────────────────────────────────────────────── */
    function showMain() {
      document.getElementById("main-view").style.display = "block";
      document.getElementById("qs-bar").style.display    = "flex";
      setGreeting(uName);
      loadAtt();
    }
    function showGate() {
      document.getElementById("gate-view").style.display = "flex";
    }

    if (typeof microsoftTeams !== "undefined") {
      microsoftTeams.app.initialize()
        .then(function () {
          microsoftTeams.app.notifyAppLoaded();
          return microsoftTeams.app.getContext();
        })
        .then(function (ctx) {
          uEmail = ((ctx.user && ctx.user.userPrincipalName) || "").toLowerCase();
          uName  = (ctx.user && ctx.user.displayName)        || "";
          var theme = (ctx.app && ctx.app.theme) || ctx.theme || "default";
          applyTheme(theme);
          try { microsoftTeams.app.registerOnThemeChangeHandler(applyTheme); } catch (_) {}
          if (!uEmail || PILOT.has(uEmail)) { showMain(); } else { showGate(); }
        })
        .catch(function () { showMain(); });  // outside Teams — show for dev convenience
    } else {
      showMain();
    }
  </script>
</body>
</html>
