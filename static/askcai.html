<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskCai — Policy Q&A</title>
  <script src="https://unpkg.com/@microsoft/teams-js@2.22.0/dist/MicrosoftTeams.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #f3f2f1;
      color: #323130;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Gate message (non-pilot) ── */
    #gate-msg {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
    }
    #gate-msg h1 { font-size: 1.2rem; margin-bottom: 8px; }
    #gate-msg p  { color: #605e5c; font-size: 0.9rem; }

    /* ── Chat area ── */
    #chat-wrap {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #edebe9;
      border-bottom-left-radius: 4px;
    }
    .msg.typing {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #edebe9;
      color: #605e5c;
      font-style: italic;
    }

    /* ── Input bar ── */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px 14px;
      background: #ffffff;
      border-top: 1px solid #edebe9;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #c8c6c4;
      border-radius: 20px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .input-bar input:focus { border-color: #0078d4; }

    .input-bar button {
      padding: 10px 16px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .input-bar button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>

  <div id="gate-msg">
    <h1>Access restricted</h1>
    <p>AskCAI is currently in pilot. Contact HR to request access.</p>
  </div>

  <div id="chat-wrap">
    <div id="messages">
      <div class="msg bot">👋 Hi! I'm CAI, your HR policy assistant. Ask me anything about Caizin's policies.</div>
    </div>
    <div class="input-bar">
      <input id="question-input" type="text" placeholder="Ask a policy question…" autocomplete="off" />
      <button id="send-btn" onclick="sendQuestion()">Send</button>
    </div>
  </div>

  <script>
    const BOT_URL = window.location.origin;

    const PILOT_ALLOWLIST = new Set([
      "maitreyee.joshi@caizin.com",
      "yash.nikam@caizin.com",
      "rohan.lande@caizin.com",
    ]);

    microsoftTeams.app.initialize().then(() => {
      microsoftTeams.app.notifyAppLoaded();
      microsoftTeams.app.notifySuccess();
      return microsoftTeams.app.getContext();
    }).then((ctx) => {
      const email = (ctx.user && ctx.user.userPrincipalName || "").toLowerCase();
      if (PILOT_ALLOWLIST.has(email)) {
        showChat();
      } else {
        showGate();
      }
    }).catch(() => {
      // Outside Teams (local dev) — show chat for testing
      showChat();
    });

    function showChat() {
      document.getElementById("chat-wrap").style.display = "flex";
      document.getElementById("gate-msg").style.display = "none";
      document.getElementById("question-input").focus();
    }
    function showGate() {
      document.getElementById("chat-wrap").style.display = "none";
      document.getElementById("gate-msg").style.display = "flex";
    }

    document.getElementById("question-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });

    function appendMsg(text, role) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      const container = document.getElementById("messages");
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
      return el;
    }

    async function sendQuestion() {
      const input = document.getElementById("question-input");
      const btn   = document.getElementById("send-btn");
      const text  = input.value.trim();
      if (!text) return;

      input.value = "";
      btn.disabled = true;
      appendMsg(text, "user");

      const typingEl = appendMsg("Thinking…", "typing");

      try {
        const res = await fetch(`${BOT_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text, policy_only: true }),
        });
        const data = await res.json();
        typingEl.remove();
        appendMsg(data.answer || "Sorry, I couldn't find an answer.", "bot");
      } catch (e) {
        typingEl.remove();
        appendMsg("⚠️ Network error. Please try again.", "bot");
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
