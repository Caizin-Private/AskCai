<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <script src="https://unpkg.com/@microsoft/teams-js@2.22.0/dist/MicrosoftTeams.min.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get("theme");
      document.documentElement.setAttribute("data-theme",
        p === "dark" ? "dark" : p === "contrast" ? "contrast" : "default");
    })();
  </script>
  <style>
    :root, [data-theme="default"] {
      --bg: #ffffff; --text: #242424; --text2: #616161; --brand: #0078d4;
    }
    [data-theme="dark"] {
      --bg: #292929; --text: #ffffff; --text2: #adadad; --brand: #479ef5;
    }
    [data-theme="contrast"] {
      --bg: #000000; --text: #ffffff; --text2: #ffffff; --brand: #1aebff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
    }
    [data-theme="default"] { color-scheme: light; }
    [data-theme="dark"]    { color-scheme: dark; }
    [data-theme="contrast"]{ color-scheme: dark; }
    body {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; text-align: center;
      padding: 32px;
    }
    .icon {
      font-size: 2.5rem; line-height: 1;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p  { font-size: 0.875rem; color: var(--text2); max-width: 280px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="icon">🚧</div>
  <h1>This feature is coming soon</h1>
  <p>We're working on it. Check back later or contact your HR team for updates.</p>
  <script>
    if (typeof microsoftTeams !== "undefined") {
      microsoftTeams.app.initialize()
        .then(function() {
          microsoftTeams.app.notifyAppLoaded();
          return microsoftTeams.app.getContext();
        })
        .then(function(ctx) {
          var theme = (ctx.app && ctx.app.theme) || ctx.theme || "default";
          document.documentElement.setAttribute("data-theme",
            theme === "dark" ? "dark" : theme === "contrast" ? "contrast" : "default");
          try { microsoftTeams.app.registerOnThemeChangeHandler(function(t) {
            document.documentElement.setAttribute("data-theme",
              t === "dark" ? "dark" : t === "contrast" ? "contrast" : "default");
          }); } catch (_) {}
        })
        .catch(function() {});
    }
  </script>
</body>
</html>
