<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Pulse</title>
  <script src="https://unpkg.com/@microsoft/teams-js@2.22.0/dist/MicrosoftTeams.min.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get("theme");
      document.documentElement.setAttribute("data-theme",
        p === "dark" ? "dark" : p === "contrast" ? "contrast" : "default");
    })();
  </script>
  <style>
    /* ══════════════════════════════════════════════════════════════════════════
       LIGHT (default)
       ══════════════════════════════════════════════════════════════════════════ */
    :root, [data-theme="default"] {
      --bg:        #ffffff;
      --bg-sec:    #f7f8fa;
      --bg-hover:  #f2f4f7;
      --text:      #1b1d21;
      --text2:     #444a55;
      --text3:     #8a909e;
      --brand:     #0f6cbd;
      --brand-light: #eef5fc;
      --border:    #e4e7ec;
      --border-s:  #eef0f3;
      --input-bg:  #f4f6f9;
      --header-bg: #fbfcfd;
      --avatar-bg: #eef2f8;
      --ring:      rgba(15,108,189,0.35);

      --st-office-bg:  #e7f4ec; --st-office-fg:  #1e7a3e;
      --st-wfh-bg:     #e8f1fb; --st-wfh-fg:     #0f5fa8;
      --st-leave-bg:   #fbf1dc; --st-leave-fg:   #97671a;
      --st-client-bg:  #efeafa; --st-client-fg:  #5e46a8;
      --st-absent-bg:  #fceaec; --st-absent-fg:  #b3283f;
      --st-pending-bg: #f2f3f5; --st-pending-fg: #5c6370;

      --pl-office:  #eef7f1; --pl-wfh:     #eef4fc; --pl-leave:   #fbf4e3;
      --pl-client:  #f2eefb; --pl-absent:  #fcedef; --pl-total:   #f4f6f9;
    }

    /* ══════════════════════════════════════════════════════════════════════════
       DARK — neutral flat surfaces + heavily muted accents (no bright fills)
       ══════════════════════════════════════════════════════════════════════════ */
    [data-theme="dark"] {
      --bg:        #1b1b1d;
      --bg-sec:    #232326;
      --bg-hover:  #2a2a2e;
      --text:      #e7e8ea;
      --text2:     #b6b9c0;
      --text3:     #83868f;
      --brand:     #5aa2ec;
      --brand-light: rgba(90,162,236,0.14);
      --border:    #313236;
      --border-s:  #292a2e;
      --input-bg:  #232326;
      --header-bg: #202023;
      --avatar-bg: #2c2d31;
      --ring:      rgba(90,162,236,0.45);

      --st-office-bg:  rgba(94,196,132,0.13);  --st-office-fg:  #6cc98c;
      --st-wfh-bg:     rgba(90,162,236,0.15);  --st-wfh-fg:     #6fb0f0;
      --st-leave-bg:   rgba(224,182,96,0.14);  --st-leave-fg:   #e0b660;
      --st-client-bg:  rgba(173,150,224,0.15); --st-client-fg:  #ad96e0;
      --st-absent-bg:  rgba(228,120,140,0.14); --st-absent-fg:  #e4788c;
      --st-pending-bg: rgba(255,255,255,0.05); --st-pending-fg: #9aa0ab;

      --pl-office:  rgba(94,196,132,0.08); --pl-wfh:    rgba(90,162,236,0.09);
      --pl-leave:   rgba(224,182,96,0.08); --pl-client: rgba(173,150,224,0.09);
      --pl-absent:  rgba(228,120,140,0.08); --pl-total:  rgba(255,255,255,0.04);
    }

    /* ══════════════════════════════════════════════════════════════════════════
       HIGH CONTRAST
       ══════════════════════════════════════════════════════════════════════════ */
    [data-theme="contrast"] {
      --bg:        #000000;
      --bg-sec:    #0d0d0d;
      --bg-hover:  #1a1a1a;
      --text:      #ffffff;
      --text2:     #ffffff;
      --text3:     #cfcfcf;
      --brand:     #1aebff;
      --brand-light: #001a1f;
      --border:    #ffffff;
      --border-s:  #4a4a4a;
      --input-bg:  #0d0d0d;
      --header-bg: #0d0d0d;
      --avatar-bg: #1a1a1a;
      --ring:      #1aebff;

      --st-office-bg:  #0d0d0d; --st-office-fg:  #3ff23f;
      --st-wfh-bg:     #0d0d0d; --st-wfh-fg:     #1aebff;
      --st-leave-bg:   #0d0d0d; --st-leave-fg:   #ffe600;
      --st-client-bg:  #0d0d0d; --st-client-fg:  #d9a6ff;
      --st-absent-bg:  #0d0d0d; --st-absent-fg:  #ff6b6b;
      --st-pending-bg: #0d0d0d; --st-pending-fg: #cccccc;

      --pl-office: #0d0d0d; --pl-wfh: #0d0d0d; --pl-leave: #0d0d0d;
      --pl-client: #0d0d0d; --pl-absent: #0d0d0d; --pl-total: #0d0d0d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    [data-theme="default"] { color-scheme: light; }
    [data-theme="dark"]    { color-scheme: dark; }
    [data-theme="contrast"]{ color-scheme: dark; }

    /* ── Gate / Loading ──────────────────────────────────────────────────────── */
    .center-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 8px;
    }
    .center-state h1 { font-size: 1.1rem; }
    .center-state p  { color: var(--text3); font-size: 0.875rem; }

    /* ── Dashboard view ──────────────────────────────────────────────────────── */
    #dash-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .dash-inner {
      max-width: 1180px; width: 100%;
      margin: 0 auto;
      display: flex; flex-direction: column;
      flex: 1; overflow: hidden;
    }

    /* ── Top bar (date + sync status, no title) ──────────────────────────────── */
    .info-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px 12px;
      flex-shrink: 0;
    }
    .data-date { font-size: 0.9rem; color: var(--text); font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
    .edit-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .edit-dot.green {
      background: #2fb168;
      box-shadow: 0 0 0 3px rgba(47,177,104,0.18);
      animation: dot-pulse 2.4s ease-in-out infinite;
    }
    .edit-dot.red { background: #d9534f; box-shadow: 0 0 0 3px rgba(217,83,79,0.18); }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .info-right { display: flex; align-items: center; gap: 10px; }
    .last-synced {
      font-size: 0.74rem; color: var(--text3); white-space: nowrap; font-weight: 500;
      background: var(--bg-sec); border: 1px solid var(--border-s);
      padding: 4px 10px; border-radius: 20px;
    }

    /* ── Main split: roster (left) + stats sidebar (right) ───────────────────── */
    .main {
      display: flex; flex: 1; overflow: hidden;
      border-top: 1px solid var(--border);
    }
    .roster-pane {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .side {
      width: 300px; flex-shrink: 0;
      background: var(--header-bg);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 18px 18px 22px;
    }
    .side::-webkit-scrollbar { width: 6px; }
    .side::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .side h4 {
      font-size: 0.7rem; font-weight: 650; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text3); margin-bottom: 15px;
    }
    /* hero "present today" card */
    .hero { background: var(--bg-sec); border: 1px solid var(--border-s); border-radius: 12px; padding: 15px 16px; margin-bottom: 12px; }
    .hero .hv { font-size: 1.9rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1; color: var(--st-office-fg); }
    .hero .hv small { font-size: 0.95rem; font-weight: 600; color: var(--text3); }
    .hero .hl { font-size: 0.78rem; color: var(--text3); margin-top: 6px; }
    .hero .track { height: 6px; background: var(--bg-hover); border-radius: 4px; margin-top: 12px; overflow: hidden; }
    .hero .track span { display: block; height: 100%; background: var(--st-office-fg); border-radius: 4px; transition: width 0.4s ease; }
    /* stat row cards (clickable filters) */
    .stat-rows { display: flex; flex-direction: column; gap: 8px; }
    .rcard {
      display: flex; align-items: center; gap: 11px;
      background: var(--bg-sec); border: 1px solid var(--border-s); border-radius: 11px;
      padding: 11px 13px; cursor: pointer; user-select: none;
      transition: transform 0.13s ease, border-color 0.13s ease, box-shadow 0.13s ease;
    }
    .rcard:hover { transform: translateY(-1px); border-color: var(--border); }
    .rcard.active { box-shadow: inset 0 0 0 1.5px currentColor; border-color: transparent; }
    .rcard .r-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; background: currentColor; }
    .rcard .r-mid { flex: 1; min-width: 0; }
    .rcard .r-lbl { font-size: 0.78rem; font-weight: 600; color: var(--text2); margin-bottom: 7px; }
    .rcard.active .r-lbl { color: currentColor; }
    .rcard .r-bar { height: 5px; border-radius: 3px; background: var(--bg-hover); overflow: hidden; }
    .rcard .r-bar span { display: block; height: 100%; border-radius: 3px; transition: width 0.4s ease; }
    .rcard .r-val { font-size: 1.25rem; font-weight: 750; letter-spacing: -0.02em; }

    /* ── Table header row ────────────────────────────────────────────────────── */
    .table-header-row {
      display: flex; align-items: stretch;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--header-bg);
      position: sticky; top: 0; z-index: 2;
    }
    .th-num-col {
      width: 60px;
      display: flex; align-items: center; padding: 0 16px;
      font-size: 0.74rem; font-weight: 650; letter-spacing: 0.04em;
      color: var(--text3); text-transform: uppercase;
      flex-shrink: 0;
    }
    .th-search-wrap {
      flex: 1;
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px;
      background: var(--input-bg);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .th-search-wrap:focus-within {
      background: var(--bg);
      box-shadow: inset 0 -2px 0 var(--brand);
    }
    .th-search-icon { color: var(--text3); flex-shrink: 0; }
    .th-search {
      flex: 1;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      height: 44px;
    }
    .th-search::placeholder { color: var(--text3); font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.72rem; }
    .th-search:not(:placeholder-shown) { font-size: 0.875rem; font-weight: 400; letter-spacing: 0; text-transform: none; }
    .th-status-col {
      width: 210px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 10px;
      padding: 0 20px;
    }
    .result-count {
      font-size: 0.72rem; color: var(--text3); white-space: nowrap; font-weight: 500;
      background: var(--bg-sec); padding: 3px 8px; border-radius: 10px;
      border: 1px solid var(--border-s);
    }

    /* ── Filter btn ──────────────────────────────────────────────────────────── */
    .filter-wrap { position: relative; flex-shrink: 0; }
    .filter-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text2);
      font-size: 0.76rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--text3); background: var(--bg-hover); }
    .filter-btn.active { border-color: currentColor; }
    .filter-btn svg { flex-shrink: 0; transition: transform 0.15s; }
    .filter-btn.dropdown-open svg { transform: rotate(180deg); }
    .filter-dropdown {
      display: none;
      position: absolute; right: 0; top: calc(100% + 6px);
      min-width: 180px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.16), 0 2px 6px rgba(0,0,0,0.08);
      z-index: 100;
      overflow: hidden;
      padding: 5px;
    }
    .filter-dropdown.open { display: block; }
    .filter-option {
      padding: 8px 11px;
      font-size: 0.82rem;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.1s;
      display: flex; align-items: center; gap: 9px;
      color: var(--text2);
      text-transform: none; letter-spacing: 0;
    }
    .filter-option:hover { background: var(--bg-hover); color: var(--text); }
    .filter-option.selected { color: var(--brand); font-weight: 600; background: var(--brand-light); }
    .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Table ───────────────────────────────────────────────────────────────── */
    .table-wrap { flex: 1; overflow-y: auto; scrollbar-gutter: stable; }
    .table-wrap::-webkit-scrollbar { width: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    tbody tr { transition: background 0.1s; cursor: default; }
    tbody tr:hover td { background: var(--bg-hover); }
    tr:last-child td { border-bottom: none; }

    td {
      padding: 0;
      border-bottom: 1px solid var(--border-s);
      font-size: 0.875rem;
    }
    .col-num {
      width: 60px; text-align: center;
      font-size: 0.74rem; font-weight: 600; color: var(--text3);
      vertical-align: middle;
    }
    .col-status { width: 210px; }

    .cell-num { display: flex; align-items: center; justify-content: center; height: 54px; padding-left: 16px; }
    .cell-name { display: flex; align-items: center; gap: 13px; padding: 10px 16px 10px 4px; min-width: 0; }
    .cell-status { display: flex; justify-content: flex-end; padding: 10px 20px; }
    .emp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Avatar ──────────────────────────────────────────────────────────────── */
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--avatar-bg);
      color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .emp-name { font-size: 0.875rem; color: var(--text); font-weight: 500; }

    /* ── Status chip ─────────────────────────────────────────────────────────── */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 11px 4px 9px; border-radius: 6px;
      font-size: 0.76rem; font-weight: 600;
      letter-spacing: 0.005em;
    }
    .chip::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .chip-Office          { background: var(--st-office-bg);  color: var(--st-office-fg);  }
    .chip-WFH             { background: var(--st-wfh-bg);     color: var(--st-wfh-fg);     }
    .chip-Leave           { background: var(--st-leave-bg);   color: var(--st-leave-fg);   }
    .chip-Client-Location { background: var(--st-client-bg);  color: var(--st-client-fg);  }
    .chip-Floater-Holiday { background: var(--st-leave-bg);   color: var(--st-leave-fg);   }
    .chip-Absent          { background: var(--st-absent-bg);  color: var(--st-absent-fg);  }
    .chip-Pending         { background: var(--st-pending-bg); color: var(--st-pending-fg); }

    .empty-msg {
      padding: 60px 16px;
      text-align: center;
      color: var(--text3);
      font-size: 0.875rem;
    }
    .empty-msg svg { opacity: 0.3; margin-bottom: 10px; }

    /* ── Narrow windows: stack stats above the roster ────────────────────────── */
    @media (max-width: 720px) {
      .main { flex-direction: column; overflow-y: auto; }
      .roster-pane { overflow: visible; }
      .table-wrap { overflow: visible; }
      .side {
        width: 100%; order: -1;
        border-left: none; border-bottom: 1px solid var(--border);
      }
      .side .stat-rows { flex-direction: row; flex-wrap: wrap; }
      .side .rcard { flex: 1; min-width: 140px; }
      .table-header-row { position: static; }
    }
  </style>
</head>
<body>

  <div id="gate-view" class="center-state" style="display:none">
    <h1>Access restricted</h1>
    <p>Dashboard is currently in pilot. Contact HR to request access.</p>
  </div>

  <div id="loading-view" class="center-state" style="display:none">
    <p>Loading attendance data…</p>
  </div>

  <div id="dash-view">
   <div class="dash-inner">
    <!-- Top bar: date + sync status -->
    <div class="info-bar">
      <span class="data-date" id="data-date"></span>
      <div class="info-right">
        <span class="last-synced" id="last-synced"></span>
        <span class="edit-dot" id="edit-dot"></span>
      </div>
    </div>

    <div class="main">
     <!-- Roster (left) -->
     <div class="roster-pane">
    <!-- Table header: # | employee search | status filter -->
    <div class="table-header-row">
      <div class="th-num-col">S.No.</div>
      <div class="th-search-wrap">
        <svg class="th-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="search-input" class="th-search" type="text"
               placeholder="Employees" oninput="applyFilters()" autocomplete="off" />
      </div>
      <div class="th-status-col">
        <div class="filter-wrap">
          <button class="filter-btn" id="filter-btn" onclick="toggleFilter(event)">
            <span id="filter-label">Status</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </button>
          <div class="filter-dropdown" id="filter-dropdown">
            <div class="filter-option selected" data-value="all" onclick="selectFilter(this)"><span class="filter-dot" style="background:var(--text3)"></span>All statuses</div>
            <div class="filter-option" data-value="Absent"          onclick="selectFilter(this)"><span class="filter-dot" style="background:var(--st-absent-fg)"></span>Absent</div>
            <div class="filter-option" data-value="Client Location" onclick="selectFilter(this)"><span class="filter-dot" style="background:var(--st-client-fg)"></span>Client Location</div>
            <div class="filter-option" data-value="Leave"           onclick="selectFilter(this)"><span class="filter-dot" style="background:var(--st-leave-fg)"></span>Leave</div>
            <div class="filter-option" data-value="Office"          onclick="selectFilter(this)"><span class="filter-dot" style="background:var(--st-office-fg)"></span>Office</div>
            <div class="filter-option" data-value="WFH"             onclick="selectFilter(this)"><span class="filter-dot" style="background:var(--st-wfh-fg)"></span>Home</div>
          </div>
        </div>
        <span class="result-count" id="result-count" style="display:none"></span>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <tbody id="table-body"></tbody>
      </table>
    </div>
     </div>

     <!-- Stats sidebar (right) -->
     <aside class="side">
       <h4>Today at a glance</h4>
       <div id="hero-card"></div>
       <div class="stat-rows" id="stat-rows"></div>
     </aside>
    </div>
   </div>
  </div>

  <script>
    "use strict";

    var BASE = window.location.origin;


    var _allRecords   = [];
    var _activeFilter = "all";
    var _refreshTimer = null;

    /* ── Theme ──────────────────────────────────────────────────────────────── */
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme",
        t === "dark" ? "dark" : t === "contrast" ? "contrast" : "default");
    }

    /* ── Utilities ──────────────────────────────────────────────────────────── */
    function esc(v) {
      return String(v || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function chipClass(bucket) {
      return "chip chip-" + (bucket || "").replace(/ /g, "-");
    }

    /* ── Display name overrides ─────────────────────────────────────────────── */
    var DISPLAY_NAME = { "WFH": "Home" };
    function displayName(bucket) { return DISPLAY_NAME[bucket] || bucket; }

    /* ── Filter dropdown ────────────────────────────────────────────────────── */
    function toggleFilter(e) {
      e.stopPropagation();
      var dd   = document.getElementById("filter-dropdown");
      var btn  = document.getElementById("filter-btn");
      var open = dd.classList.toggle("open");
      btn.classList.toggle("dropdown-open", open);
    }

    function applyFilterBtnColor(bucket) {
      var btn = document.getElementById("filter-btn");
      if (!bucket || bucket === "all") {
        btn.style.color      = "";
        btn.classList.remove("active");
      } else {
        var s = PILL_STYLE[bucket];
        if (s) {
          btn.style.color = s.fg;
          btn.classList.add("active");
        }
      }
    }

    function selectFilter(el) {
      _activeFilter = el.getAttribute("data-value");
      document.querySelectorAll(".filter-option").forEach(function(o) {
        o.classList.toggle("selected", o === el);
      });
      document.getElementById("filter-btn").classList.remove("dropdown-open");
      document.getElementById("filter-label").textContent = _activeFilter === "all" ? "Status" : displayName(_activeFilter);
      document.getElementById("filter-dropdown").classList.remove("open");
      applyFilterBtnColor(_activeFilter);
      updatePillActive();
      applyFilters();
    }

    document.addEventListener("click", function() {
      var dd  = document.getElementById("filter-dropdown");
      var btn = document.getElementById("filter-btn");
      dd.classList.remove("open");
      btn.classList.remove("dropdown-open");
    });

    /* ── Status colours ─────────────────────────────────────────────────────── */
    var PILL_STYLE = {
      "Office":          { bg: "var(--pl-office)",  fg: "var(--st-office-fg)"  },
      "WFH":             { bg: "var(--pl-wfh)",     fg: "var(--st-wfh-fg)"     },
      "Leave":           { bg: "var(--pl-leave)",   fg: "var(--st-leave-fg)"   },
      "Client Location": { bg: "var(--pl-client)",  fg: "var(--st-client-fg)"  },
      "Absent":          { bg: "var(--pl-absent)",  fg: "var(--st-absent-fg)"  },
    };
    var BUCKET_ORDER = ["Office", "WFH", "Client Location", "Leave", "Absent"];

    function renderSummary(records) {
      var counts = {};
      records.forEach(function(r) { counts[r.bucket] = (counts[r.bucket] || 0) + 1; });
      var total = records.length || 1;

      // Hero: present & working = Office + WFH + Client Location
      var present = (counts["Office"] || 0) + (counts["WFH"] || 0) + (counts["Client Location"] || 0);
      var rate = Math.round(present / total * 100);
      var away = records.length - present;
      document.getElementById("hero-card").innerHTML =
        "<div class='hero'>" +
          "<div class='hv'>" + present + " <small>/ " + records.length + "</small></div>" +
          "<div class='hl'>Present &amp; Working \u00b7 " + away + " away</div>" +
          "<div class='track'><span style='width:" + rate + "%'></span></div>" +
        "</div>";

      // Stat rows (clickable filters)
      var rows = document.getElementById("stat-rows");
      rows.innerHTML = "";

      // Total card
      var totalCard = document.createElement("div");
      totalCard.className = "rcard" + (_activeFilter === "all" ? " active" : "");
      totalCard.setAttribute("data-bucket", "__total");
      totalCard.style.color = "var(--text2)";
      totalCard.innerHTML =
        "<span class='r-dot' style='background:var(--text3)'></span>" +
        "<div class='r-mid'><div class='r-lbl'>Total</div>" +
        "<div class='r-bar'><span style='width:100%;background:var(--text3)'></span></div></div>" +
        "<div class='r-val'>" + records.length + "</div>";
      totalCard.onclick = function() { selectFilterByValue("all"); };
      rows.appendChild(totalCard);

      BUCKET_ORDER.forEach(function(b) {
        var s = PILL_STYLE[b] || { fg: "var(--text2)" };
        var v = counts[b] || 0;
        var p = Math.round(v / total * 100);
        var card = document.createElement("div");
        card.className = "rcard";
        card.setAttribute("data-bucket", b);
        card.style.color = s.fg;
        card.innerHTML =
          "<span class='r-dot'></span>" +
          "<div class='r-mid'><div class='r-lbl'>" + esc(displayName(b)) + "</div>" +
          "<div class='r-bar'><span style='width:" + Math.max(p, 3) + "%;background:" + s.fg + "'></span></div></div>" +
          "<div class='r-val'>" + v + "</div>";
        card.onclick = (function(bucket) { return function() {
          selectFilterByValue(_activeFilter === bucket ? "all" : bucket);
        }; })(b);
        rows.appendChild(card);
      });

      updatePillActive();
    }

    function selectFilterByValue(val) {
      _activeFilter = val;
      document.querySelectorAll(".filter-option").forEach(function(o) {
        o.classList.toggle("selected", o.getAttribute("data-value") === val);
      });
      document.getElementById("filter-label").textContent = val === "all" ? "Status" : displayName(val);
      applyFilterBtnColor(val);
      updatePillActive();
      applyFilters();
    }

    function updatePillActive() {
      document.querySelectorAll(".rcard").forEach(function(p) {
        var b  = p.getAttribute("data-bucket");
        var on = b === "__total" ? _activeFilter === "all" : b === _activeFilter;
        p.classList.toggle("active", on);
      });
    }

    /* ── Name formatting ────────────────────────────────────────────────────── */
    function toTitleCase(name) {
      return (name || "").trim().replace(/\S+/g, function(w) {
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      });
    }

    /* ── Initials avatar ────────────────────────────────────────────────────── */
    function initials(name) {
      var parts = (name || "").trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return (parts[0] || "?").slice(0, 2).toUpperCase();
    }

    /* ── Table ──────────────────────────────────────────────────────────────── */
    function applyFilters() {
      var q   = (document.getElementById("search-input").value || "").trim().toLowerCase();
      var flt = _activeFilter;

      var filtered = _allRecords.filter(function(r) {
        return (!q   || (r.name || "").toLowerCase().includes(q)) &&
               (flt === "all" || r.bucket === flt);
      });

      var cnt = document.getElementById("result-count");
      var isFiltered = filtered.length < _allRecords.length;
      cnt.textContent  = isFiltered ? filtered.length + " of " + _allRecords.length : "";
      cnt.style.display = isFiltered ? "" : "none";

      renderTable(filtered);
    }

    function renderTable(records) {
      var tbody = document.getElementById("table-body");
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="3"><div class="empty-msg">' +
          '<svg width="36" height="36" viewBox="0 0 24 24" fill="var(--text3)" style="display:block;margin:0 auto 8px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' +
          'No employees match the current filter.</div></td></tr>';
        return;
      }
      tbody.innerHTML = records.map(function(r, i) {
        return "<tr>" +
          "<td class='col-num'><div class='cell-num'>" + (i + 1) + "</div></td>" +
          "<td class='col-name'><div class='cell-name'>" +
            "<div class='avatar'>" + esc(initials(r.name)) + "</div>" +
            "<span class='emp-name'>" + esc(toTitleCase(r.name)) + "</span>" +
          "</div></td>" +
          "<td class='col-status'><div class='cell-status'><span class='" + chipClass(r.bucket) + "'>" + esc(displayName(r.bucket)) + "</span></div></td>" +
          "</tr>";
      }).join("");
    }

    /* ── Edit window indicator (9 AM – 3 PM IST) ───────────────────────────── */
    function updateEditIndicator() {
      var now  = new Date();
      var ist  = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
      var open = ist.getHours() >= 9 && ist.getHours() < 15;
      document.getElementById("edit-dot").className = "edit-dot " + (open ? "green" : "red");
    }

    /* ── Data fetch ─────────────────────────────────────────────────────────── */
    function loadData() {
      fetch(BASE + "/tabs/dashboard-data")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          _allRecords = (data.records || []).filter(function(r) {
            return r.bucket !== "Pending";
          }).sort(function(a, b) {
            return (a.name || "").localeCompare(b.name || "");
          });

          var dateEl = document.getElementById("data-date");
          try {
            var p = (data.date || "").split("-");
            dateEl.textContent = new Date(+p[0], p[1] - 1, +p[2])
              .toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
          } catch(e) { dateEl.textContent = data.date || ""; }

          document.getElementById("last-synced").textContent =
            "Last synced " + new Date().toLocaleTimeString("en-IN",
              { hour: "2-digit", minute: "2-digit", hour12: false });

          renderSummary(_allRecords);
          applyFilters();
          document.getElementById("loading-view").style.display = "none";
          document.getElementById("dash-view").style.display   = "flex";
        })
        .catch(function() {
          document.getElementById("last-synced").textContent = "Sync failed";
          document.getElementById("loading-view").style.display = "none";
          document.getElementById("dash-view").style.display   = "flex";
        })
        .finally(function() {});
    }

    /* ── Auto-refresh every 60 s ────────────────────────────────────────────── */
    function startAutoRefresh() {
      if (_refreshTimer) clearInterval(_refreshTimer);
      _refreshTimer = setInterval(function() {
        loadData();
        updateEditIndicator();
      }, 60000);
    }

    /* ── Init ───────────────────────────────────────────────────────────────── */
    function showDash() {
      document.getElementById("gate-view").style.display    = "none";
      document.getElementById("loading-view").style.display = "flex";
      document.getElementById("dash-view").style.display    = "none";
      updateEditIndicator();
      loadData();
      startAutoRefresh();
    }

    function showGate() {
      document.getElementById("gate-view").style.display    = "flex";
      document.getElementById("loading-view").style.display = "none";
    }

    if (typeof microsoftTeams !== "undefined") {
      microsoftTeams.app.initialize()
        .then(function() {
          microsoftTeams.app.notifyAppLoaded();
          return microsoftTeams.app.getContext();
        })
        .then(function(ctx) {
          var email = ((ctx.user && ctx.user.userPrincipalName) || "").toLowerCase();
          var theme = (ctx.app && ctx.app.theme) || ctx.theme || "default";
          applyTheme(theme);
          try { microsoftTeams.app.registerOnThemeChangeHandler(applyTheme); } catch (_) {}
          showDash();
        })
        .catch(function() { showDash(); });
    } else {
      showDash();
    }
  </script>
</body>
</html>
