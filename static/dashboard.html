<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Attendance</title>
  <script src="https://unpkg.com/@microsoft/teams-js@2.22.0/dist/MicrosoftTeams.min.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get("theme");
      document.documentElement.setAttribute("data-theme",
        p === "dark" ? "dark" : p === "contrast" ? "contrast" : "default");
    })();
  </script>
  <style>
    /* ── Fluent UI tokens ───────────────────────────────────────────────── */
    :root, [data-theme="default"] {
      --bg:        #ffffff;
      --bg-sec:    #f5f5f5;
      --bg-hover:  #e8e8e8;
      --text:      #242424;
      --text2:     #424242;
      --text3:     #616161;
      --brand:     #0078d4;
      --border:    #d1d1d1;
      --border-s:  #e0e0e0;
      --input-bg:  #f5f5f5;

      --chip-office-bg:   #e8f5e9; --chip-office-fg:   #2e7d32;
      --chip-wfh-bg:      #e3f2fd; --chip-wfh-fg:      #1565c0;
      --chip-leave-bg:    #fff8e1; --chip-leave-fg:    #f57f17;
      --chip-floater-bg:  #fff8e1; --chip-floater-fg:  #f57f17;
      --chip-client-bg:   #e8f5e9; --chip-client-fg:   #2e7d32;
      --chip-absent-bg:   #ffebee; --chip-absent-fg:   #c62828;
      --chip-pending-bg:  #f5f5f5; --chip-pending-fg:  #616161;
    }
    [data-theme="dark"] {
      --bg:        #292929;
      --bg-sec:    #3d3d3d;
      --bg-hover:  #454545;
      --text:      #ffffff;
      --text2:     #d6d6d6;
      --text3:     #adadad;
      --brand:     #479ef5;
      --border:    #525252;
      --border-s:  #3d3d3d;
      --input-bg:  #3d3d3d;

      --chip-office-bg:   #1b5e20; --chip-office-fg:   #a5d6a7;
      --chip-wfh-bg:      #0d47a1; --chip-wfh-fg:      #90caf9;
      --chip-leave-bg:    #4e2300; --chip-leave-fg:    #ffcc80;
      --chip-floater-bg:  #4e2300; --chip-floater-fg:  #ffcc80;
      --chip-client-bg:   #1b5e20; --chip-client-fg:   #a5d6a7;
      --chip-absent-bg:   #4e0000; --chip-absent-fg:   #ef9a9a;
      --chip-pending-bg:  #3d3d3d; --chip-pending-fg:  #adadad;
    }
    [data-theme="contrast"] {
      --bg:        #000000;
      --bg-sec:    #1f1f1f;
      --bg-hover:  #2a2a2a;
      --text:      #ffffff;
      --text2:     #ffffff;
      --text3:     #ffffff;
      --brand:     #1aebff;
      --border:    #ffffff;
      --border-s:  #ffffff;
      --input-bg:  #0d0d0d;

      --chip-office-bg:   #1f1f1f; --chip-office-fg:   #00ff00;
      --chip-wfh-bg:      #1f1f1f; --chip-wfh-fg:      #1aebff;
      --chip-leave-bg:    #1f1f1f; --chip-leave-fg:    #ffff00;
      --chip-floater-bg:  #1f1f1f; --chip-floater-fg:  #ffff00;
      --chip-client-bg:   #1f1f1f; --chip-client-fg:   #00ff00;
      --chip-absent-bg:   #1f1f1f; --chip-absent-fg:   #ff6666;
      --chip-pending-bg:  #1f1f1f; --chip-pending-fg:  #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
    }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Let native form controls (select, input) respect the OS/Teams colour scheme */
    [data-theme="default"] { color-scheme: light; }
    [data-theme="dark"]    { color-scheme: dark; }
    [data-theme="contrast"]{ color-scheme: dark; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .tab-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-s);
      flex-shrink: 0;
    }
    .tab-icon  { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; }
    .tab-title { font-size: 0.9375rem; font-weight: 600; }
    .date-chip {
      font-size: 0.78rem; color: var(--text3);
      background: var(--bg-sec); border-radius: 4px;
      padding: 2px 8px;
    }
    .hdr-spacer { flex: 1; }
    .last-updated { font-size: 0.75rem; color: var(--text3); }
    .refresh-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--brand);
      font-size: 0.8rem; font-family: inherit;
      cursor: pointer;
      transition: background 0.12s;
    }
    .refresh-btn:hover { background: var(--bg-hover); }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Gate / Loading ──────────────────────────────────────────────────── */
    .center-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 8px;
    }
    .center-state h1 { font-size: 1.1rem; }
    .center-state p  { color: var(--text3); font-size: 0.875rem; }

    /* ── Dashboard view ──────────────────────────────────────────────────── */
    #dash-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }

    /* ── Summary pills ───────────────────────────────────────────────────── */
    .summary-bar {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 10px 16px 8px;
      border-bottom: 1px solid var(--border-s);
      flex-shrink: 0;
    }
    .sum-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 11px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; user-select: none;
      transition: opacity 0.12s;
    }
    .sum-pill:hover { opacity: 0.78; }
    .sum-pill .count { font-size: 0.88rem; font-weight: 700; }

    /* ── Toolbar ─────────────────────────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-s);
      flex-shrink: 0;
    }
    .toolbar input, .toolbar select {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.12s;
    }
    .toolbar input { flex: 1; }
    .toolbar input::placeholder { color: var(--text3); }
    .toolbar input:focus,
    .toolbar select:focus  { border-color: var(--brand); }
    .toolbar select { min-width: 148px; cursor: pointer; }
    .result-count { font-size: 0.8rem; color: var(--text3); white-space: nowrap; }

    /* ── Table ───────────────────────────────────────────────────────────── */
    .table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; background: var(--bg); z-index: 1; }
    th {
      padding: 9px 16px;
      text-align: left;
      font-size: 0.72rem; font-weight: 700;
      color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-s);
    }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-s);
      font-size: 0.875rem;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg-hover); }
    .col-name   { width: 60%; }
    .col-status { width: 40%; }

    /* ── Status chip ─────────────────────────────────────────────────────── */
    .chip {
      display: inline-block;
      padding: 2px 10px; border-radius: 12px;
      font-size: 0.78rem; font-weight: 600;
    }
    .chip-Office          { background: var(--chip-office-bg);  color: var(--chip-office-fg);  }
    .chip-WFH             { background: var(--chip-wfh-bg);     color: var(--chip-wfh-fg);     }
    .chip-Leave           { background: var(--chip-leave-bg);   color: var(--chip-leave-fg);   }
    .chip-Client-Location { background: var(--chip-client-bg);  color: var(--chip-client-fg);  }
    .chip-Floater-Holiday { background: var(--chip-floater-bg); color: var(--chip-floater-fg); }
    .chip-Absent          { background: var(--chip-absent-bg);  color: var(--chip-absent-fg);  }
    .chip-Pending         { background: var(--chip-pending-bg); color: var(--chip-pending-fg); }

    .empty-msg {
      padding: 48px 16px;
      text-align: center;
      color: var(--text3);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="tab-header">
    <img src="/icon.png" class="tab-icon" alt="" />
    <span class="tab-title">Dashboard</span>
    <span class="date-chip" id="date-chip"></span>
    <span class="hdr-spacer"></span>
    <span class="last-updated" id="last-updated"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      Refresh
    </button>
  </div>

  <div id="gate-view" class="center-state" style="display:none">
    <h1>Access restricted</h1>
    <p>Dashboard is currently in pilot. Contact HR to request access.</p>
  </div>

  <div id="loading-view" class="center-state" style="display:none">
    <p>Loading attendance data…</p>
  </div>

  <div id="dash-view">
    <div class="summary-bar" id="summary-bar"></div>
    <div class="toolbar">
      <input id="search-input" type="text" placeholder="Search by name…"
             oninput="applyFilters()" autocomplete="off" />
      <select id="status-filter" onchange="applyFilters()">
        <option value="all">All Statuses</option>
        <option value="Office">Office</option>
        <option value="WFH">WFH</option>
        <option value="Leave">Leave</option>
        <option value="Client Location">Client Location</option>
        <option value="Floater Holiday">Floater Holiday</option>
        <option value="Absent">Absent</option>
        <option value="Pending">Pending</option>
      </select>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-name">Employee</th>
            <th class="col-status">Status</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    "use strict";

    var BASE = window.location.origin;

    var PILOT = new Set([
      "maitreyee.joshi@caizin.com",
      "yash.nikam@caizin.com",
      "rohan.lande@caizin.com",
      "nikhil.negi@caizin.com",
    ]);

    var _allRecords  = [];
    var _refreshTimer = null;

    /* ── Theme ────────────────────────────────────────────────────────────── */
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme",
        t === "dark" ? "dark" : t === "contrast" ? "contrast" : "default");
    }

    /* ── Utilities ────────────────────────────────────────────────────────── */
    function esc(v) {
      return String(v || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function chipClass(bucket) {
      return "chip chip-" + (bucket || "Pending").replace(/ /g, "-");
    }

    /* ── Summary pills ────────────────────────────────────────────────────── */
    var PILL_STYLE = {
      "Office":          { bg: "var(--chip-office-bg)",  fg: "var(--chip-office-fg)"  },
      "WFH":             { bg: "var(--chip-wfh-bg)",     fg: "var(--chip-wfh-fg)"     },
      "Leave":           { bg: "var(--chip-leave-bg)",   fg: "var(--chip-leave-fg)"   },
      "Client Location": { bg: "var(--chip-client-bg)",  fg: "var(--chip-client-fg)"  },
      "Floater Holiday": { bg: "var(--chip-floater-bg)", fg: "var(--chip-floater-fg)" },
      "Absent":          { bg: "var(--chip-absent-bg)",  fg: "var(--chip-absent-fg)"  },
      "Pending":         { bg: "var(--chip-pending-bg)", fg: "var(--chip-pending-fg)" },
    };
    var BUCKET_ORDER = ["Office", "WFH", "Client Location", "Leave", "Floater Holiday", "Absent", "Pending"];

    function renderSummary(records) {
      var counts = {};
      records.forEach(function(r) { counts[r.bucket] = (counts[r.bucket] || 0) + 1; });

      var bar = document.getElementById("summary-bar");
      bar.innerHTML = "";

      var total = document.createElement("span");
      total.className = "sum-pill";
      total.style.cssText = "background:var(--bg-sec);color:var(--text2)";
      total.innerHTML = "Total <span class='count'>" + records.length + "</span>";
      total.onclick = function() { setFilter("all"); };
      bar.appendChild(total);

      BUCKET_ORDER.forEach(function(b) {
        if (!counts[b]) return;
        var s = PILL_STYLE[b] || { bg: "var(--bg-sec)", fg: "var(--text2)" };
        var pill = document.createElement("span");
        pill.className = "sum-pill";
        pill.style.cssText = "background:" + s.bg + ";color:" + s.fg;
        pill.innerHTML = esc(b) + " <span class='count'>" + counts[b] + "</span>";
        pill.onclick = (function(bucket) { return function() { setFilter(bucket); }; })(b);
        bar.appendChild(pill);
      });
    }

    function setFilter(val) {
      document.getElementById("status-filter").value = val;
      applyFilters();
    }

    /* ── Table ────────────────────────────────────────────────────────────── */
    function applyFilters() {
      var q   = (document.getElementById("search-input").value || "").trim().toLowerCase();
      var flt = document.getElementById("status-filter").value;

      var filtered = _allRecords.filter(function(r) {
        return (!q   || (r.name   || "").toLowerCase().includes(q)) &&
               (flt === "all" || r.bucket === flt);
      });

      var cnt = document.getElementById("result-count");
      cnt.textContent = (filtered.length < _allRecords.length)
        ? filtered.length + " of " + _allRecords.length
        : "";

      renderTable(filtered);
    }

    function renderTable(records) {
      var tbody = document.getElementById("table-body");
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="2"><div class="empty-msg">No employees match the current filter.</div></td></tr>';
        return;
      }
      tbody.innerHTML = records.map(function(r) {
        return "<tr>" +
          "<td class='col-name'>"   + esc(r.name)   + "</td>" +
          "<td class='col-status'><span class='" + chipClass(r.bucket) + "'>" + esc(r.bucket) + "</span></td>" +
          "</tr>";
      }).join("");
    }

    /* ── Data fetch ───────────────────────────────────────────────────────── */
    function loadData() {
      var btn = document.getElementById("refresh-btn");
      btn.disabled = true;

      fetch(BASE + "/tabs/dashboard-data")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          _allRecords = (data.records || []).slice().sort(function(a, b) {
            return (a.name || "").localeCompare(b.name || "");
          });

          // Date chip
          var dc = document.getElementById("date-chip");
          try {
            var p = (data.date || "").split("-");
            dc.textContent = new Date(+p[0], p[1] - 1, +p[2])
              .toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
          } catch(e) { dc.textContent = data.date || ""; }

          // Last updated
          document.getElementById("last-updated").textContent =
            "Updated " + new Date().toLocaleTimeString("en-IN",
              { hour: "2-digit", minute: "2-digit", hour12: false });

          renderSummary(_allRecords);
          applyFilters();

          document.getElementById("loading-view").style.display = "none";
          document.getElementById("dash-view").style.display   = "flex";
        })
        .catch(function() {
          document.getElementById("loading-view").style.display = "none";
          document.getElementById("dash-view").style.display   = "flex";
        })
        .finally(function() { btn.disabled = false; });
    }

    /* ── Auto-refresh every 60 s ──────────────────────────────────────────── */
    function startAutoRefresh() {
      if (_refreshTimer) clearInterval(_refreshTimer);
      _refreshTimer = setInterval(loadData, 60000);
    }

    /* ── Init ─────────────────────────────────────────────────────────────── */
    function showDash() {
      document.getElementById("gate-view").style.display    = "none";
      document.getElementById("loading-view").style.display = "flex";
      document.getElementById("dash-view").style.display    = "none";
      loadData();
      startAutoRefresh();
    }

    function showGate() {
      document.getElementById("gate-view").style.display    = "flex";
      document.getElementById("loading-view").style.display = "none";
    }

    if (typeof microsoftTeams !== "undefined") {
      microsoftTeams.app.initialize()
        .then(function() {
          microsoftTeams.app.notifyAppLoaded();
          return microsoftTeams.app.getContext();
        })
        .then(function(ctx) {
          var email = ((ctx.user && ctx.user.userPrincipalName) || "").toLowerCase();
          var theme = (ctx.app && ctx.app.theme) || ctx.theme || "default";
          applyTheme(theme);
          try { microsoftTeams.app.registerOnThemeChangeHandler(applyTheme); } catch (_) {}
          if (!email || PILOT.has(email)) { showDash(); } else { showGate(); }
        })
        .catch(function() { showDash(); });
    } else {
      showDash();
    }
  </script>
</body>
</html>
