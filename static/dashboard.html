<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Pulse</title>
  <script src="https://unpkg.com/@microsoft/teams-js@2.22.0/dist/MicrosoftTeams.min.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get("theme");
      document.documentElement.setAttribute("data-theme",
        p === "dark" ? "dark" : p === "contrast" ? "contrast" : "default");
    })();
  </script>
  <style>
    :root, [data-theme="default"] {
      --bg:        #ffffff;
      --bg-sec:    #f5f5f5;
      --bg-hover:  #e8e8e8;
      --text:      #242424;
      --text2:     #424242;
      --text3:     #616161;
      --brand:     #0078d4;
      --border:    #d1d1d1;
      --border-s:  #e0e0e0;
      --input-bg:  #f5f5f5;

      --chip-office-bg:   #e8f5e9; --chip-office-fg:   #2e7d32;
      --chip-wfh-bg:      #e3f2fd; --chip-wfh-fg:      #1565c0;
      --chip-leave-bg:    #fff8e1; --chip-leave-fg:    #f57f17;
      --chip-floater-bg:  #fff8e1; --chip-floater-fg:  #f57f17;
      --chip-client-bg:   #e8f5e9; --chip-client-fg:   #2e7d32;
      --chip-absent-bg:   #ffebee; --chip-absent-fg:   #c62828;
      --chip-pending-bg:  #f5f5f5; --chip-pending-fg:  #616161;
    }
    [data-theme="dark"] {
      --bg:        #292929;
      --bg-sec:    #3d3d3d;
      --bg-hover:  #454545;
      --text:      #ffffff;
      --text2:     #d6d6d6;
      --text3:     #adadad;
      --brand:     #479ef5;
      --border:    #525252;
      --border-s:  #3d3d3d;
      --input-bg:  #3d3d3d;

      --chip-office-bg:   #1b5e20; --chip-office-fg:   #a5d6a7;
      --chip-wfh-bg:      #0d47a1; --chip-wfh-fg:      #90caf9;
      --chip-leave-bg:    #4e2300; --chip-leave-fg:    #ffcc80;
      --chip-floater-bg:  #4e2300; --chip-floater-fg:  #ffcc80;
      --chip-client-bg:   #1b5e20; --chip-client-fg:   #a5d6a7;
      --chip-absent-bg:   #4e0000; --chip-absent-fg:   #ef9a9a;
      --chip-pending-bg:  #3d3d3d; --chip-pending-fg:  #adadad;
    }
    [data-theme="contrast"] {
      --bg:        #000000;
      --bg-sec:    #1f1f1f;
      --bg-hover:  #2a2a2a;
      --text:      #ffffff;
      --text2:     #ffffff;
      --text3:     #ffffff;
      --brand:     #1aebff;
      --border:    #ffffff;
      --border-s:  #ffffff;
      --input-bg:  #0d0d0d;

      --chip-office-bg:   #1f1f1f; --chip-office-fg:   #00ff00;
      --chip-wfh-bg:      #1f1f1f; --chip-wfh-fg:      #1aebff;
      --chip-leave-bg:    #1f1f1f; --chip-leave-fg:    #ffff00;
      --chip-floater-bg:  #1f1f1f; --chip-floater-fg:  #ffff00;
      --chip-client-bg:   #1f1f1f; --chip-client-fg:   #00ff00;
      --chip-absent-bg:   #1f1f1f; --chip-absent-fg:   #ff6666;
      --chip-pending-bg:  #1f1f1f; --chip-pending-fg:  #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
    }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    [data-theme="default"] { color-scheme: light; }
    [data-theme="dark"]    { color-scheme: dark; }
    [data-theme="contrast"]{ color-scheme: dark; }

    /* ── Gate / Loading ──────────────────────────────────────────────────────── */
    .center-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 8px;
    }
    .center-state h1 { font-size: 1.1rem; }
    .center-state p  { color: var(--text3); font-size: 0.875rem; }

    /* ── Dashboard view ──────────────────────────────────────────────────────── */
    #dash-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .dash-inner {
      max-width: 860px; width: 100%;
      margin: 0 auto;
      display: flex; flex-direction: column;
      flex: 1; overflow: hidden;
    }

    /* ── Info bar (date + editable indicator) ───────────────────────────────── */
    .info-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px 6px;
      flex-shrink: 0;
    }
    .data-date {
      font-size: 0.8rem; color: var(--text3); font-weight: 500;
    }
    .edit-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--text3);
    }
    .edit-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .edit-dot.green { background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,0.25); }
    .edit-dot.red   { background: #ef4444; box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
    .info-right {
      display: flex; align-items: center; gap: 12px;
    }
    .last-synced { font-size: 0.75rem; color: var(--text3); white-space: nowrap; }
    .refresh-btn {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .refresh-btn:hover { background: var(--bg-hover); color: var(--brand); border-color: var(--brand); }
    .refresh-btn:disabled { opacity: 0.45; cursor: default; }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary pills ───────────────────────────────────────────────────────── */
    .summary-bar {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-s);
      flex-shrink: 0;
    }
    .sum-pill {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center;
      flex: 1;
      padding: 10px 8px; border-radius: 10px;
      min-width: 60px;
      cursor: pointer; user-select: none;
      transition: opacity 0.12s;
    }
    .sum-pill:hover { opacity: 0.78; }
    .sum-pill .pill-label { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.02em; }
    .sum-pill .pill-count { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }

    /* ── Table header row with search + filter ───────────────────────────────── */
    .table-header-row {
      display: flex; align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-s);
      flex-shrink: 0;
      background: var(--bg);
      position: sticky; top: 0; z-index: 2;
    }
    .th-search {
      width: 60%;
      padding: 5px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: inherit;
      outline: none;
      transition: border-color 0.12s, background 0.12s, font-size 0.12s, font-weight 0.12s, text-transform 0.12s;
    }
    .th-search::placeholder {
      color: var(--text3);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .th-search:focus {
      border-color: var(--brand);
      background: var(--input-bg);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    .th-search:not(:placeholder-shown) {
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    .th-status-col {
      width: 40%;
      display: flex; align-items: center; justify-content: flex-start;
      gap: 10px;
      padding-left: 16px;
    }
    .result-count { font-size: 0.78rem; color: var(--text3); white-space: nowrap; }
    /* ── Column headings (search + filter) ──────────────────────────────────── */
    .filter-wrap { position: relative; flex-shrink: 0; width: 100%; }
    .filter-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text3);
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      cursor: pointer;
      transition: color 0.12s;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active { color: var(--brand); }
    .filter-btn svg { flex-shrink: 0; transition: transform 0.15s; }
    .filter-btn.active svg { transform: rotate(180deg); }
    .filter-dropdown {
      display: none;
      position: absolute; left: 0; top: calc(100% + 4px);
      min-width: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 100;
      overflow: hidden;
    }
    .filter-dropdown.open { display: block; }
    .filter-option {
      padding: 9px 14px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.1s;
    }
    .filter-option:hover { background: var(--bg-hover); }
    .filter-option.selected { color: var(--brand); font-weight: 600; }

    /* ── Table ───────────────────────────────────────────────────────────────── */
    .table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-s);
      font-size: 0.875rem;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg-hover); }
    .col-name   { width: 60%; }
    .col-status { width: 40%; }

    /* ── Status chip ─────────────────────────────────────────────────────────── */
    .chip {
      display: inline-block;
      padding: 2px 10px; border-radius: 12px;
      font-size: 0.78rem; font-weight: 600;
    }
    .chip-Office          { background: var(--chip-office-bg);  color: var(--chip-office-fg);  }
    .chip-WFH             { background: var(--chip-wfh-bg);     color: var(--chip-wfh-fg);     }
    .chip-Leave           { background: var(--chip-leave-bg);   color: var(--chip-leave-fg);   }
    .chip-Client-Location { background: var(--chip-client-bg);  color: var(--chip-client-fg);  }
    .chip-Floater-Holiday { background: var(--chip-floater-bg); color: var(--chip-floater-fg); }
    .chip-Absent          { background: var(--chip-absent-bg);  color: var(--chip-absent-fg);  }
    .chip-Pending         { background: var(--chip-pending-bg); color: var(--chip-pending-fg); }

    .empty-msg {
      padding: 48px 16px;
      text-align: center;
      color: var(--text3);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div id="gate-view" class="center-state" style="display:none">
    <h1>Access restricted</h1>
    <p>Dashboard is currently in pilot. Contact HR to request access.</p>
  </div>

  <div id="loading-view" class="center-state" style="display:none">
    <p>Loading attendance data…</p>
  </div>

  <div id="dash-view">
   <div class="dash-inner">
    <!-- Date + editable indicator -->
    <div class="info-bar">
      <span class="data-date" id="data-date"></span>
      <div class="info-right">
        <div class="edit-indicator">
          <span class="edit-dot" id="edit-dot"></span>
          <span id="edit-label"></span>
        </div>
        <span class="last-synced" id="last-synced"></span>
        <button class="refresh-btn" id="refresh-btn" onclick="loadData()" title="Refresh now">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Summary pills -->
    <div class="summary-bar" id="summary-bar"></div>

    <!-- Table header: employee search heading + status filter heading -->
    <div class="table-header-row">
      <input id="search-input" class="th-search" type="text"
             placeholder="Employees" oninput="applyFilters()" autocomplete="off" />
      <div class="th-status-col">
      <div class="filter-wrap">
        <button class="filter-btn" id="filter-btn" onclick="toggleFilter(event)">
          <span id="filter-label">Status</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="filter-dropdown" id="filter-dropdown">
          <div class="filter-option selected" data-value="all" onclick="selectFilter(this)">All</div>
          <div class="filter-option" data-value="Absent"          onclick="selectFilter(this)">Absent</div>
          <div class="filter-option" data-value="Client Location" onclick="selectFilter(this)">Client Location</div>
          <div class="filter-option" data-value="Floater Holiday" onclick="selectFilter(this)">Floater Holiday</div>
          <div class="filter-option" data-value="Leave"           onclick="selectFilter(this)">Leave</div>
          <div class="filter-option" data-value="Office"          onclick="selectFilter(this)">Office</div>
          <div class="filter-option" data-value="Pending"         onclick="selectFilter(this)">Pending</div>
          <div class="filter-option" data-value="WFH"             onclick="selectFilter(this)">WFH</div>
        </div>
      </div>
      <span class="result-count" id="result-count"></span>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <tbody id="table-body"></tbody>
      </table>
    </div>
   </div>
  </div>

  <script>
    "use strict";

    var BASE = window.location.origin;

    var PILOT = new Set([
      "maitreyee.joshi@caizin.com",
      "yash.nikam@caizin.com",
      "rohan.lande@caizin.com",
      "nikhil.negi@caizin.com",
    ]);

    var _allRecords   = [];
    var _activeFilter = "all";
    var _refreshTimer = null;

    /* ── Theme ──────────────────────────────────────────────────────────────── */
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme",
        t === "dark" ? "dark" : t === "contrast" ? "contrast" : "default");
    }

    /* ── Utilities ──────────────────────────────────────────────────────────── */
    function esc(v) {
      return String(v || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function chipClass(bucket) {
      return "chip chip-" + (bucket || "Pending").replace(/ /g, "-");
    }

    /* ── Filter dropdown ────────────────────────────────────────────────────── */
    function toggleFilter(e) {
      e.stopPropagation();
      var dd  = document.getElementById("filter-dropdown");
      var btn = document.getElementById("filter-btn");
      var open = dd.classList.toggle("open");
      btn.classList.toggle("active", open);
    }

    function selectFilter(el) {
      _activeFilter = el.getAttribute("data-value");
      document.querySelectorAll(".filter-option").forEach(function(o) {
        o.classList.toggle("selected", o === el);
      });
      var btn = document.getElementById("filter-btn");
      btn.classList.toggle("active", _activeFilter !== "all");
      document.getElementById("filter-label").textContent = _activeFilter === "all" ? "Status" : _activeFilter;
      document.getElementById("filter-dropdown").classList.remove("open");
      applyFilters();
    }

    document.addEventListener("click", function() {
      document.getElementById("filter-dropdown").classList.remove("open");
      if (_activeFilter === "all") {
        document.getElementById("filter-btn").classList.remove("active");
      }
    });

    /* ── Summary pills ──────────────────────────────────────────────────────── */
    var PILL_STYLE = {
      "Office":          { bg: "var(--chip-office-bg)",  fg: "var(--chip-office-fg)"  },
      "WFH":             { bg: "var(--chip-wfh-bg)",     fg: "var(--chip-wfh-fg)"     },
      "Leave":           { bg: "var(--chip-leave-bg)",   fg: "var(--chip-leave-fg)"   },
      "Client Location": { bg: "var(--chip-client-bg)",  fg: "var(--chip-client-fg)"  },
      "Floater Holiday": { bg: "var(--chip-floater-bg)", fg: "var(--chip-floater-fg)" },
      "Absent":          { bg: "var(--chip-absent-bg)",  fg: "var(--chip-absent-fg)"  },
      "Pending":         { bg: "var(--chip-pending-bg)", fg: "var(--chip-pending-fg)" },
    };
    var BUCKET_ORDER = ["Office", "WFH", "Client Location", "Leave", "Floater Holiday", "Absent", "Pending"];

    function renderSummary(records) {
      var counts = {};
      records.forEach(function(r) { counts[r.bucket] = (counts[r.bucket] || 0) + 1; });

      var bar = document.getElementById("summary-bar");
      bar.innerHTML = "";

      var total = document.createElement("span");
      total.className = "sum-pill";
      total.style.cssText = "background:var(--bg-sec);color:var(--text2)";
      total.innerHTML = "<span class='pill-label'>Total</span><span class='pill-count'>" + records.length + "</span>";
      total.onclick = function() { selectFilterByValue("all"); };
      bar.appendChild(total);

      BUCKET_ORDER.forEach(function(b) {
        if (!counts[b]) return;
        var s = PILL_STYLE[b] || { bg: "var(--bg-sec)", fg: "var(--text2)" };
        var pill = document.createElement("span");
        pill.className = "sum-pill";
        pill.style.cssText = "background:" + s.bg + ";color:" + s.fg;
        pill.innerHTML = "<span class='pill-label'>" + esc(b) + "</span><span class='pill-count'>" + counts[b] + "</span>";
        pill.onclick = (function(bucket) { return function() { selectFilterByValue(bucket); }; })(b);
        bar.appendChild(pill);
      });
    }

    function selectFilterByValue(val) {
      _activeFilter = val;
      document.querySelectorAll(".filter-option").forEach(function(o) {
        o.classList.toggle("selected", o.getAttribute("data-value") === val);
      });
      document.getElementById("filter-btn").classList.toggle("active", val !== "all");
      document.getElementById("filter-label").textContent = val === "all" ? "Status" : val;
      applyFilters();
    }

    /* ── Table ──────────────────────────────────────────────────────────────── */
    function applyFilters() {
      var q   = (document.getElementById("search-input").value || "").trim().toLowerCase();
      var flt = _activeFilter;

      var filtered = _allRecords.filter(function(r) {
        return (!q   || (r.name || "").toLowerCase().includes(q)) &&
               (flt === "all" || r.bucket === flt);
      });

      var cnt = document.getElementById("result-count");
      cnt.textContent = (filtered.length < _allRecords.length)
        ? filtered.length + " of " + _allRecords.length
        : "";

      renderTable(filtered);
    }

    function renderTable(records) {
      var tbody = document.getElementById("table-body");
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="2"><div class="empty-msg">No employees match the current filter.</div></td></tr>';
        return;
      }
      tbody.innerHTML = records.map(function(r) {
        return "<tr>" +
          "<td class='col-name'>"   + esc(r.name) + "</td>" +
          "<td class='col-status'><span class='" + chipClass(r.bucket) + "'>" + esc(r.bucket) + "</span></td>" +
          "</tr>";
      }).join("");
    }

    /* ── Edit window indicator (9 AM – 3 PM IST) ───────────────────────────── */
    function updateEditIndicator() {
      var now = new Date();
      var ist = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
      var h   = ist.getHours();
      var open = h >= 9 && h < 15;
      var dot   = document.getElementById("edit-dot");
      var label = document.getElementById("edit-label");
      dot.className   = "edit-dot " + (open ? "green" : "red");
      label.textContent = open ? "Status updates open" : "Status updates closed";
    }

    /* ── Data fetch ─────────────────────────────────────────────────────────── */
    function loadData() {
      var btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      btn.classList.add("spinning");

      fetch(BASE + "/tabs/dashboard-data")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          _allRecords = (data.records || []).slice().sort(function(a, b) {
            return (a.name || "").localeCompare(b.name || "");
          });

          // Show the date of the fetched data
          var dateEl = document.getElementById("data-date");
          try {
            var p = (data.date || "").split("-");
            dateEl.textContent = new Date(+p[0], p[1] - 1, +p[2])
              .toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
          } catch(e) { dateEl.textContent = data.date || ""; }

          // Last synced time
          document.getElementById("last-synced").textContent =
            "Synced " + new Date().toLocaleTimeString("en-IN",
              { hour: "2-digit", minute: "2-digit", hour12: false });

          renderSummary(_allRecords);
          applyFilters();
          document.getElementById("loading-view").style.display = "none";
          document.getElementById("dash-view").style.display   = "flex";
        })
        .catch(function() {
          document.getElementById("last-synced").textContent = "Sync failed";
          document.getElementById("loading-view").style.display = "none";
          document.getElementById("dash-view").style.display   = "flex";
        })
        .finally(function() {
          btn.disabled = false;
          btn.classList.remove("spinning");
        });
    }

    /* ── Auto-refresh every 60 s ────────────────────────────────────────────── */
    function startAutoRefresh() {
      if (_refreshTimer) clearInterval(_refreshTimer);
      _refreshTimer = setInterval(function() {
        loadData();
        updateEditIndicator();
      }, 60000);
    }

    /* ── Init ───────────────────────────────────────────────────────────────── */
    function showDash() {
      document.getElementById("gate-view").style.display    = "none";
      document.getElementById("loading-view").style.display = "flex";
      document.getElementById("dash-view").style.display    = "none";
      updateEditIndicator();
      loadData();
      startAutoRefresh();
    }

    function showGate() {
      document.getElementById("gate-view").style.display    = "flex";
      document.getElementById("loading-view").style.display = "none";
    }

    if (typeof microsoftTeams !== "undefined") {
      microsoftTeams.app.initialize()
        .then(function() {
          microsoftTeams.app.notifyAppLoaded();
          return microsoftTeams.app.getContext();
        })
        .then(function(ctx) {
          var email = ((ctx.user && ctx.user.userPrincipalName) || "").toLowerCase();
          var theme = (ctx.app && ctx.app.theme) || ctx.theme || "default";
          applyTheme(theme);
          try { microsoftTeams.app.registerOnThemeChangeHandler(applyTheme); } catch (_) {}
          if (!email || PILOT.has(email)) { showDash(); } else { showGate(); }
        })
        .catch(function() { showDash(); });
    } else {
      showDash();
    }
  </script>
